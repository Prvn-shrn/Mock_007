const quizDiv = document.getElementById('quiz');
const resultsDiv = document.getElementById('results');
const submitBtn = document.getElementById('submit');
const timeSpan = document.getElementById('time');
let timeLeft = 900, timerId;

function startTimer() {
  timeSpan.textContent = timeLeft;
  timerId = setInterval(() => {
    if (--timeLeft <= 0) showResults();
    timeSpan.textContent = timeLeft;
  }, 1000);
}

function buildQuiz() {
  quizDiv.innerHTML = quizData.map((q,i) => `
    <div class="question">
      <p><strong>${i+1}. ${q.question}</strong></p>
      <div class="options">
        ${q.options.map((opt,j) => `
          <input type="radio" id="q${i}_o${j}" name="q${i}" value="${j}">
          <label for="q${i}_o${j}">
            ${opt.img ? `<img src="${opt.img}" class="option-img">` : opt.text}
          </label><br>`).join('')}
      </div>
    </div>`).join('');
  submitBtn.disabled = false;
  submitBtn.style.display = 'inline-block';  // ensure visible
  quizDiv.style.display = 'block';
  resultsDiv.style.display = 'none';
}

function showResults() {
  clearInterval(timerId);
  submitBtn.style.display = 'none';
  quizDiv.style.display = 'none';
  resultsDiv.style.display = 'block';

  const answers = quizData.map((q, i) => {
    const sel = document.querySelector(`input[name=q${i}]:checked`);
    const idx = sel ? +sel.value : -1;
    return {
      question: q.question,
      selected: idx,
      correct: q.answer,
      options: q.options,
      explanation: q.explanation,
      isCorrect: idx === q.answer
    };
  });


  const correctCount = answers.filter(a => a.isCorrect).length;
  const wrongCount = answers.length - correctCount;

  resultsDiv.innerHTML = `
    <h2>Your score: ${correctCount}/${answers.length} (✔️${correctCount}, ❌${wrongCount})</h2>
    ${answers.map((a, i) => `
      <div class="question-review">
        <p><strong>Q${i+1}: ${a.question}</strong></p>
        <ul>
          ${a.options.map((opt, j) => `
            <li style="
              ${j === a.correct ? 'font-weight:bold;color:green;' : ''}
              ${j === a.selected && j !== a.correct ? 'text-decoration:underline;color:red;' : ''}
            ">
              ${opt.img 
                ? `<img src="${opt.img}" class="option-img">` 
                : opt.text}
              ${j === a.correct ? ' (Correct Answer)' : ''}
              ${j === a.selected && j !== a.correct ? ' (Your Answer)' : ''}
            </li>`).join('')}
        </ul>
        <p class="exp"><em>${a.explanation}</em></p>
      </div>`).join('')}
    <button id="retake-btn" class="retake">Retake Quiz</button>
  `;

 

  document.getElementById('retake-btn').onclick = resetQuiz;
}

function resetQuiz() {
  timeLeft = 60;
  clearInterval(timerId);
  buildQuiz();
  startTimer();
}

submitBtn.addEventListener('click', showResults);
buildQuiz();
startTimer();
  </script>
